<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basics</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #6b6b72;
        --card: #ffffff;
        --border: rgba(0, 0, 0, 0.08);
        --hover: rgba(0, 0, 0, 0.05);
        --primary: #0a6fdb;
        --danger: #c62828;
        --danger-bg: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111113;
          --fg: #f2f2f2;
          --muted: #9a9aa0;
          --card: #18181b;
          --border: rgba(255, 255, 255, 0.08);
          --hover: rgba(255, 255, 255, 0.08);
          --danger: #ff6b6b;
          --danger-bg: #c62828;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* The window has no native decorations: this bar is how it moves and closes. */
      .titlebar {
        flex: 0 0 auto;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-left: 24px;
        user-select: none;
      }
      .titlebar-label { font-size: 12px; font-weight: 500; color: var(--muted); }
      .window-controls { display: flex; align-self: stretch; }
      .window-controls button {
        width: 46px;
        height: 100%;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
        transition: background-color 100ms ease-out, color 100ms ease-out;
      }
      .window-controls button:hover { background: var(--hover); color: var(--fg); }
      .window-controls button.close:hover { background: var(--danger-bg); color: #fff; }
      .window-controls button:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
      .window-controls svg { display: block; }
      .window-controls svg[hidden] { display: none; }
      main { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; padding: 0 16px 24px; }
      .panel { width: min(560px, 100%); }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
      .logo { width: 28px; height: 28px; flex-shrink: 0; }
      .status { margin-top: 18px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
      .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--primary); animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      .error { display: none; margin-top: 18px; }
      .error h1 { font-size: 15px; margin: 0 0 6px; color: var(--danger); }
      .error p { margin: 0 0 12px; color: var(--muted); }
      pre {
        margin: 0 0 14px; max-height: 240px; overflow: auto; padding: 12px; border-radius: 10px;
        background: var(--card); border: 1px solid var(--border); font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap;
      }
      .actions button {
        font: inherit; font-weight: 500; padding: 6px 14px; border-radius: 999px; border: 0;
        background: var(--primary); color: #fff; cursor: pointer;
      }
      .actions { display: flex; gap: 8px; }
      .actions button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
      .actions button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header class="titlebar" data-tauri-drag-region="deep">
      <span class="titlebar-label" aria-hidden="true">Basics</span>
      <div class="window-controls">
        <button type="button" id="minimize" aria-label="Minimize" title="Minimize">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.1" /></svg>
        </button>
        <button type="button" id="maximize" aria-label="Maximize" title="Maximize">
          <svg id="icon-maximize" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.1" /></svg>
          <svg id="icon-restore" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M5.5 5.5V3.5h7v7h-2" fill="none" stroke="currentColor" stroke-width="1.1" /><rect x="3.5" y="5.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.1" /></svg>
        </button>
        <button type="button" id="close" class="close" aria-label="Close" title="Close">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.1" /></svg>
        </button>
      </div>
    </header>
    <main>
      <div class="panel">
        <div class="brand"><svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0a84ff"/><rect x="8" y="9" width="16" height="3" rx="1.5" fill="#fff"/><rect x="8" y="14.5" width="12" height="3" rx="1.5" fill="#fff" fill-opacity=".85"/><rect x="8" y="20" width="8" height="3" rx="1.5" fill="#fff" fill-opacity=".7"/></svg>Basics</div>
        <div class="status" id="starting" role="status"><span class="spinner" aria-hidden="true"></span><span>Starting Basics...</span></div>
        <section class="error" id="error" role="alert">
          <h1>Basics could not start</h1>
          <p id="message"></p>
          <pre id="log"></pre>
          <div class="actions">
            <button type="button" id="choose" hidden>Choose vault folder...</button>
            <button type="button" id="retry">Retry</button>
          </div>
        </section>
      </div>
    </main>
    <script>
      const invoke = window.__TAURI__.core.invoke;
      const starting = document.getElementById("starting");
      const error = document.getElementById("error");
      const maximizeButton = document.getElementById("maximize");
      let timer;

      // Title bar: the window is frameless, so these three buttons are the only way to
      // move, minimize, maximize and close it while the server starts.
      try {
        const win = window.__TAURI__.window.getCurrentWindow();
        const run = (action) => Promise.resolve(action).catch((err) => console.error(err));
        const showMaximized = (maximized) => {
          const label = maximized ? "Restore" : "Maximize";
          maximizeButton.setAttribute("aria-label", label);
          maximizeButton.title = label;
          document.getElementById("icon-maximize").hidden = maximized;
          document.getElementById("icon-restore").hidden = !maximized;
        };
        document.getElementById("minimize").addEventListener("click", () => run(win.minimize()));
        document.getElementById("close").addEventListener("click", () => run(win.close()));
        maximizeButton.addEventListener("click", () => run(win.toggleMaximize()));
        run(win.onResized(() => run(win.isMaximized().then(showMaximized))));
        run(win.isMaximized().then(showMaximized));
      } catch (err) {
        console.error(err);
      }

      async function poll() {
        try {
          const status = await invoke("startup_status");
          if (status.phase === "error") {
            starting.style.display = "none";
            error.style.display = "block";
            const choose = document.getElementById("choose");
            const retry = document.getElementById("retry");
            choose.hidden = !status.needs_vault;
            retry.classList.toggle("secondary", status.needs_vault);
            document.getElementById("message").textContent = status.needs_vault
              ? "There is no Basics vault yet. Choose an empty folder (or an existing vault) and Basics will set it up."
              : status.message;
            document.getElementById("log").textContent = status.log.join("\n") || "(no server output)";
            return;
          }
        } catch (err) {
          console.error(err);
        }
        timer = setTimeout(poll, 300);
      }

      document.getElementById("retry").addEventListener("click", async () => {
        error.style.display = "none";
        starting.style.display = "flex";
        await invoke("retry_startup");
        clearTimeout(timer);
        poll();
      });

      document.getElementById("choose").addEventListener("click", async () => {
        try {
          const chosen = await invoke("choose_vault");
          if (!chosen) return;
          error.style.display = "none";
          starting.style.display = "flex";
          clearTimeout(timer);
          poll();
        } catch (err) {
          document.getElementById("message").textContent = String(err);
        }
      });

      poll();
    </script>
  </body>
</html>
