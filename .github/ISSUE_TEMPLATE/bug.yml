name: Bug report
description: Report a reproducible problem with the CLI, web UI or MCP server.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Check the [troubleshooting guide](https://marcozvd.github.io/basics/guide/troubleshooting.html)
        first and search existing issues to avoid duplicates. Do not include secrets or personal vault content.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem and the actual result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: The behavior you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers the bug, including commands or MCP calls.
      placeholder: |
        1. Run `basics ...`
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Web UI
        - MCP server / HTTP API
        - Core library
        - Packs
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Basics version
      description: Output of `basics --version` (or the package version).
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.14.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or logs
      description: Command output, server logs or the browser console. Redact paths and secrets.
      render: shell
    validations:
      required: false
