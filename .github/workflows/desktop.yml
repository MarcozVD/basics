name: Desktop

# Builds the desktop installers. Manual runs upload them as workflow artifacts and never
# touch a release; a `desktop-v*` tag also attaches them to a draft GitHub Release and
# produces the updater manifest `latest.json`. Tagged builds are signed with the
# TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets; a manual run
# without them still builds, just without updater artifacts, and says so in the log.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      # The three jobs merge their platform entry into the release's `latest.json`
      # (tauri-action reads it back before writing), so run them one at a time to make
      # that read-merge-upload deterministic instead of three parallel clobbers.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            args: ""
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
          - os: macos-latest
            triple: universal-apple-darwin
            args: --target universal-apple-darwin
            bundle_dir: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            args: ""
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    env:
      # True only when the repository has the updater signing key configured.
      HAS_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the signing secrets for a tagged release
        if: startsWith(github.ref, 'refs/tags/desktop-v') && env.HAS_SIGNING != 'true'
        run: |
          echo "::error::desktop-v* releases must be signed: set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets." >&2
          exit 1

      - name: Warn about an unsigned manual build
        if: github.event_name == 'workflow_dispatch' && env.HAS_SIGNING != 'true'
        run: echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without updater artifacts. This build cannot update itself."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Skip updater artifacts when there is no signing key
        if: env.HAS_SIGNING != 'true'
        run: |
          node -e "require('node:fs').writeFileSync(process.argv[1], JSON.stringify({ bundle: { createUpdaterArtifacts: false } }))" "${{ runner.temp }}/no-signing.json"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the Basics CLI and UI
        run: |
          npm ci
          npm run build

      - name: Install the desktop tooling
        run: npm ci --prefix apps/desktop

      - name: Bundle the server and the Node sidecar
        run: node apps/desktop/scripts/prepare.mjs --target-triple ${{ matrix.triple }}

      - name: Refuse an empty updater public key
        # `cargo test` runs the guard in src/update.rs that reads tauri.conf.json: a release
        # must never ship with an empty plugins.updater.pubkey. One OS is enough; the config
        # is the same everywhere, and the sidecar above is what the crate needs to compile.
        if: runner.os == 'Linux'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib update::tests::the_config_ships_an_updater_public_key

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: "${{ matrix.args }} ${{ env.HAS_SIGNING != 'true' && format('--config={0}/no-signing.json', runner.temp) || '' }}"
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: Basics desktop ${{ github.ref_name }}
          releaseBody: Signed installers; the app updates itself from the `desktop-updater` release. See https://marcozvd.github.io/basics/guide/desktop.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Smoke test the Linux build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb dbus
          # The app starts its bundled server without a vault picker only when a vault
          # already exists, so create one and point the app (and its sidecar) at it.
          vault="$RUNNER_TEMP/vault"
          node packages/basics/dist/cli.js init "$vault" --packs none
          export BASICS_DIR="$vault"
          appimage=$(find "${{ matrix.bundle_dir }}/appimage" -name '*.AppImage' | head -n1)
          test -n "$appimage"

          # Run headless (extract-and-run avoids FUSE, dbus keeps the tray alive). setsid puts
          # xvfb-run, Xvfb, dbus and the app in one new process group; the same-pid shell writes
          # that group's id first so one group kill can reap them all afterwards.
          pgid_file=$(mktemp)
          setsid sh -c 'echo $$ >"$1"; shift; exec env APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dbus-run-session -- "$@"' _ "$pgid_file" "$appimage" &
          app=$!
          for _ in $(seq 1 50); do if [ -s "$pgid_file" ]; then break; fi; sleep 0.1; done
          pgid=$(cat "$pgid_file" 2>/dev/null || true)
          rm -f "$pgid_file"
          [ -n "$pgid" ] || pgid=$app

          cleanup() {
            # SIGTERM then SIGKILL the whole group, plus a pattern sweep for anything re-parented.
            if [ -n "$pgid" ]; then
              kill -TERM -- "-$pgid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$pgid" 2>/dev/null || true
            fi
            pkill -f 'cli.js ui' 2>/dev/null || true
            pkill -f "$appimage" 2>/dev/null || true
          }

          healthy=
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4747/api/health >/dev/null 2>&1; then healthy=1; break; fi
            sleep 1
          done
          if [ -z "$healthy" ]; then
            echo "::error::the desktop app never answered /api/health on http://127.0.0.1:4747" >&2
            cleanup
            exit 1
          fi
          echo "desktop smoke test passed: /api/health answered"

          # Orphan check: SIGKILL the Tauri binary itself (not the AppImage runtime or xvfb-run)
          # and require PR_SET_PDEATHSIG to take the sidecar down with it within 10s.
          app_pid=$(pgrep -x basics-desktop | head -n1 || true)
          [ -n "$app_pid" ] || app_pid=$(pgrep -f basics-desktop | head -n1 || true)
          sidecar_pid=$(pgrep -f 'cli.js ui' | head -n1 || true)
          echo "app pid: ${app_pid:-none}, sidecar pid: ${sidecar_pid:-none}"
          if [ -n "$app_pid" ]; then kill -9 "$app_pid" 2>/dev/null || true; fi

          freed=
          for _ in $(seq 1 10); do
            alive=$(pgrep -f 'cli.js ui' | head -n1 || true)
            if [ -z "$alive" ] && ! curl -fsS http://127.0.0.1:4747/api/health >/dev/null 2>&1; then
              freed=1; break
            fi
            sleep 1
          done
          cleanup
          if [ -z "$app_pid" ] || [ -z "$freed" ]; then
            echo "::error::the sidecar outlived the app: PR_SET_PDEATHSIG did not free port 4747" >&2
            exit 1
          fi
          echo "orphan check passed: killing the app stopped the sidecar"

      - uses: actions/upload-artifact@v4
        with:
          name: basics-desktop-${{ matrix.triple }}
          path: |
            ${{ matrix.bundle_dir }}/msi/*.msi
            ${{ matrix.bundle_dir }}/nsis/*.exe
            ${{ matrix.bundle_dir }}/dmg/*.dmg
            ${{ matrix.bundle_dir }}/appimage/*.AppImage
            ${{ matrix.bundle_dir }}/deb/*.deb
            ${{ matrix.bundle_dir }}/rpm/*.rpm
          if-no-files-found: error
