name: Desktop

# Builds the unsigned desktop installers. Manual runs upload them as workflow
# artifacts; a `desktop-v*` tag also attaches them to a draft GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            args: ""
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
          - os: macos-latest
            triple: universal-apple-darwin
            args: --target universal-apple-darwin
            bundle_dir: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            args: ""
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the Basics CLI and UI
        run: |
          npm ci
          npm run build

      - name: Install the desktop tooling
        run: npm ci --prefix apps/desktop

      - name: Bundle the server and the Node sidecar
        run: node apps/desktop/scripts/prepare.mjs --target-triple ${{ matrix.triple }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: Basics desktop ${{ github.ref_name }}
          releaseBody: Unsigned installers. See https://marcozvd.github.io/basics/guide/desktop for how to open them on each OS.
          releaseDraft: true
          prerelease: false

      - name: Smoke test the Linux build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb dbus
          # The app starts its bundled server without a vault picker only when a vault
          # already exists, so create one and point the app (and its sidecar) at it.
          vault="$RUNNER_TEMP/vault"
          node packages/basics/dist/cli.js init "$vault" --packs none
          export BASICS_DIR="$vault"
          appimage=$(find "${{ matrix.bundle_dir }}/appimage" -name '*.AppImage' | head -n1)
          test -n "$appimage"

          # Run headless (extract-and-run avoids FUSE, dbus keeps the tray alive). setsid puts
          # xvfb-run, Xvfb, dbus and the app in one new process group; the same-pid shell writes
          # that group's id first so one group kill can reap them all afterwards.
          pgid_file=$(mktemp)
          setsid sh -c 'echo $$ >"$1"; shift; exec env APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a dbus-run-session -- "$@"' _ "$pgid_file" "$appimage" &
          app=$!
          for _ in $(seq 1 50); do if [ -s "$pgid_file" ]; then break; fi; sleep 0.1; done
          pgid=$(cat "$pgid_file" 2>/dev/null || true)
          rm -f "$pgid_file"
          [ -n "$pgid" ] || pgid=$app

          cleanup() {
            # SIGTERM then SIGKILL the whole group, plus a pattern sweep for anything re-parented.
            if [ -n "$pgid" ]; then
              kill -TERM -- "-$pgid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$pgid" 2>/dev/null || true
            fi
            pkill -f 'cli.js ui' 2>/dev/null || true
            pkill -f "$appimage" 2>/dev/null || true
          }

          healthy=
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4747/api/health >/dev/null 2>&1; then healthy=1; break; fi
            sleep 1
          done
          if [ -z "$healthy" ]; then
            echo "::error::the desktop app never answered /api/health on http://127.0.0.1:4747" >&2
            cleanup
            exit 1
          fi
          echo "desktop smoke test passed: /api/health answered"

          # Orphan check: SIGKILL the Tauri binary itself (not the AppImage runtime or xvfb-run)
          # and require PR_SET_PDEATHSIG to take the sidecar down with it within 10s.
          app_pid=$(pgrep -x basics-desktop | head -n1 || true)
          [ -n "$app_pid" ] || app_pid=$(pgrep -f basics-desktop | head -n1 || true)
          sidecar_pid=$(pgrep -f 'cli.js ui' | head -n1 || true)
          echo "app pid: ${app_pid:-none}, sidecar pid: ${sidecar_pid:-none}"
          if [ -n "$app_pid" ]; then kill -9 "$app_pid" 2>/dev/null || true; fi

          freed=
          for _ in $(seq 1 10); do
            alive=$(pgrep -f 'cli.js ui' | head -n1 || true)
            if [ -z "$alive" ] && ! curl -fsS http://127.0.0.1:4747/api/health >/dev/null 2>&1; then
              freed=1; break
            fi
            sleep 1
          done
          cleanup
          if [ -z "$app_pid" ] || [ -z "$freed" ]; then
            echo "::error::the sidecar outlived the app: PR_SET_PDEATHSIG did not free port 4747" >&2
            exit 1
          fi
          echo "orphan check passed: killing the app stopped the sidecar"

      - uses: actions/upload-artifact@v4
        with:
          name: basics-desktop-${{ matrix.triple }}
          path: |
            ${{ matrix.bundle_dir }}/msi/*.msi
            ${{ matrix.bundle_dir }}/nsis/*.exe
            ${{ matrix.bundle_dir }}/dmg/*.dmg
            ${{ matrix.bundle_dir }}/appimage/*.AppImage
            ${{ matrix.bundle_dir }}/deb/*.deb
            ${{ matrix.bundle_dir }}/rpm/*.rpm
          if-no-files-found: error
