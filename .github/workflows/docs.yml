name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packages/**"
      - "packs/**"
      - "scripts/demo/**"
      - "scripts/copy-*.mjs"
      - "package*.json"
      - "tsconfig.base.json"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      # docs:build also records and builds the static app demo into dist/demo.
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
